services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pte
      POSTGRES_PASSWORD: pte
      POSTGRES_DB: pte
    # 5433 on the host so this never collides with a Postgres you already run locally.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pte -d pte']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
